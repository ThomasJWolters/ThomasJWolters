<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tài Liệu Học Tập</title>
    <!-- Font chữ hiện đại từ Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Thiết lập chung với tone màu Dark Minimalist (Đen - Xám - Trắng) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #121212; /* Đen nền chủ đạo */
            color: #e0e0e0;            /* Trắng xám cho chữ */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
        }

        /* Phần nội dung chính ở giữa */
        .container {
            text-align: center;
            max-width: 600px;
            margin: auto;
            padding: 20px;
        }

        .profile-title {
            font-size: 2.2rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .profile-desc {
            font-size: 1rem;
            color: #888888; /* Xám tối cho mô tả */
            margin-bottom: 40px;
            line-height: 1.5;
        }

        /* Khung chứa các nút bấm */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
        }

        /* Kiểu dáng cho từng nút tài liệu */
        .btn {
            background-color: #1e1e1e;     /* Xám đen cho nền nút */
            color: #ffffff;                /* Chữ trắng */
            border: 1px solid #333333;     /* Viền xám tinh tế */
            padding: 16px 24px;
            border-radius: 12px;           /* Bo góc mềm mại */
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            letter-spacing: 1px;
            transition: all 0.25s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Hiệu ứng khi rê chuột vào nút */
        .btn:hover {
            background-color: #2a2a2a;     /* Sáng hơn một chút khi hover */
            border-color: #555555;         /* Viền sáng hơn */
            transform: translateY(-2px);   /* Nhấc nhẹ lên */
        }

        .btn:active {
            transform: translateY(0);
        }

        /* Chân trang */
        footer {
            font-size: 0.85rem;
            color: #666666;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <!-- Nội dung chính -->
    <div class="container">
        <h1 class="profile-title">Kho Tài Liệu Học Tập</h1>
        <p class="profile-desc">Nơi lưu trữ và tổng hợp các tài liệu môn học kỹ thuật chuyên ngành.</p>

        <!-- Danh sách các nút bấm -->
        <div class="button-group">
            <a href="#" class="btn">PHYSICS</a>
            <a href="#" class="btn">CALCULUS</a>
            <a href="#" class="btn">LINEAR</a>
        </div>
    </div>

    <!-- Chân trang -->
    <footer>
        &copy; 2026 Designed for Study.
    </footer>

</body>
</html>
