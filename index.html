<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kho Tài Liệu Học Tập</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #121212;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            text-align: center;
            max-width: 800px;
            width: 100%;
            margin: auto;
            padding: 20px;
        }

        .profile-title {
            font-size: 2.2rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .profile-desc {
            font-size: 1rem;
            color: #888888;
            margin-bottom: 40px;
            line-height: 1.5;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        .btn {
            background-color: #1e1e1e;
            color: #ffffff;
            border: 1px solid #333333;
            padding: 16px 24px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            letter-spacing: 1px;
            transition: all 0.25s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            width: 100%;
        }

        .btn:hover {
            background-color: #2a2a2a;
            border-color: #555555;
        }

        .dropdown-container {
            width: 100%;
        }

        .arrow {
            font-size: 0.8rem;
            transition: transform 0.3s ease;
        }

        .btn.active .arrow {
            transform: rotate(180deg);
        }

        .dropdown-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease-out;
            background-color: #181818;
            border-radius: 0 0 12px 12px;
            margin-top: -8px;
            border: 1px solid transparent;
            text-align: left;
        }

        .dropdown-content.show {
            max-height: 1200px;
            border-color: #333333;
            padding: 10px 0;
            margin-bottom: 10px;
            overflow-y: auto;
        }

        .doc-item {
            display: block;
            padding: 12px 20px;
            color: #b0b0b0;
            text-decoration: none;
            font-size: 0.92rem;
            transition: all 0.2s ease;
            border-left: 2px solid transparent;
            cursor: pointer;
        }

        .doc-item:hover {
            background-color: #222222;
            color: #ffffff;
            border-left-color: #888888;
            padding-left: 25px;
        }

        .pdf-viewer-container {
            margin-top: 30px;
            width: 100%;
            background-color: #1e1e1e;
            border: 1px solid #333333;
            border-radius: 12px;
            overflow: hidden;
            display: none;
        }

        .pdf-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background-color: #252525;
            border-bottom: 1px solid #333333;
            font-size: 0.9rem;
            color: #ffffff;
        }

        .close-pdf {
            background: none;
            border: none;
            color: #888888;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
        }

        .close-pdf:hover {
            color: #ffffff;
        }

        iframe {
            width: 100%;
            height: 600px;
            border: none;
            background-color: #ffffff;
        }

        footer {
            font-size: 0.85rem;
            color: #666666;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="profile-title">Kho Tài Liệu Học Tập</h1>
        <p class="profile-desc">Nơi lưu trữ và tổng hợp các tài liệu môn học kỹ thuật chuyên ngành.</p>

        <div class="button-group">
            <div class="dropdown-container">
                <button class="btn" onclick="toggleDropdown('physicsSubMenu', this)">
                    <span>PHYSICS</span>
                    <span class="arrow">▼</span>
                </button>
                <div class="dropdown-content" id="physicsSubMenu">
                    <!-- Có thêm chữ physics1/ ở trước tên file -->
                   <a class="doc-item" onclick="openPDF('PHYSIC/physics1/chuong1li1.pdf', 'Chương 1 - Physics')">📄 chuong1li1.pdf</a>
                    <a class="doc-item" onclick="openPDF('PHYSIC/physics1/chuong2li2.pdf', 'Chương 2 - Physics')">📄 chuong2li2.pdf</a>
                    <a class="doc-item" onclick="openPDF('PHYSIC/physics1/chuong3li3.pdf', 'Chương 3 - Physics')">📄 chuong3li3.pdf</a>
                    <a class="doc-item" onclick="openPDF('PHYSIC/physics1/chuong4li4.pdf', 'Chương 4 - Physics')">📄 chuong4li4.pdf</a>
                    <a class="doc-item" onclick="openPDF('PHYSIC/physics1/chuong5li1.pdf', 'Chương 5 - Physics')">📄 chuong5li1.pdf</a>
                    <a class="doc-item" onclick="openPDF('PHYSIC/physics1/chuong6li1.pdf', 'Chương 6 - Physics')">📄 chuong6li1.pdf</a>
                </div>
            </div>

            <button class="btn">
                <span>CALCULUS</span>
                <span class="arrow">▼</span>
            </button>
            <button class="btn">
                <span>LINEAR</span>
                <span class="arrow">▼</span>
            </button>
        </div>

        <div class="pdf-viewer-container" id="pdfViewerBox">
            <div class="pdf-header">
                <span id="pdfTitle">Đang xem tài liệu...</span>
                <button class="close-pdf" onclick="closePDF()">✕ Đóng</button>
            </div>
            <iframe id="pdfFrame" src=""></iframe>
        </div>
    </div>

    <footer>
        &copy; 2026 Designed for Study.
    </footer>

    <script>
        function toggleDropdown(menuId, button) {
            const content = document.getElementById(menuId);
            button.classList.toggle('active');
            content.classList.toggle('show');
        }

        function openPDF(pdfFile, titleText) {
            const viewerBox = document.getElementById('pdfViewerBox');
            const pdfFrame = document.getElementById('pdfFrame');
            const pdfTitle = document.getElementById('pdfTitle');

            pdfTitle.innerText = "Đang xem: " + titleText;
            pdfFrame.src = pdfFile;
            viewerBox.style.display = "block";
            viewerBox.scrollIntoView({ behavior: 'smooth' });
        }

        function closePDF() {
            const viewerBox = document.getElementById('pdfViewerBox');
            const pdfFrame = document.getElementById('pdfFrame');
            
            viewerBox.style.display = "none";
            pdfFrame.src = "";
        }
    </script>

</body>
</html>
