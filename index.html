<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kho Tài Liệu Học Tập</title>
    <!-- Font chữ hiện đại từ Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Thiết lập chung với tone màu Dark Minimalist (Đen - Xám - Trắng) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #121212; /* Đen nền chủ đạo */
            color: #e0e0e0;            /* Trắng xám cho chữ */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            text-align: center;
            max-width: 600px;
            width: 100%;
            margin: auto;
            padding: 20px;
        }

        .profile-title {
            font-size: 2.2rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .profile-desc {
            font-size: 1rem;
            color: #888888;
            margin-bottom: 40px;
            line-height: 1.5;
        }

        /* Khung chứa các nút bấm */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            margin: 0 auto;
        }

        /* Kiểu dáng cho từng nút môn học */
        .btn {
            background-color: #1e1e1e;
            color: #ffffff;
            border: 1px solid #333333;
            padding: 16px 24px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            letter-spacing: 1px;
            transition: all 0.25s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            width: 100%;
        }

        .btn:hover {
            background-color: #2a2a2a;
            border-color: #555555;
        }

        /* Khung bọc cho môn Physics có menu thả xuống */
        .dropdown-container {
            width: 100%;
        }

        /* Nút Physics đặc biệt có mũi tên */
        .dropdown-btn {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Biểu tượng mũi tên */
        .arrow {
            font-size: 0.8rem;
            transition: transform 0.3s ease;
        }

        /* Khi menu mở, xoay mũi tên chỉ xuống */
        .dropdown-btn.active .arrow {
            transform: rotate(180deg);
        }

        /* Danh sách tài liệu ẩn ban đầu */
        .dropdown-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease-out;
            background-color: #181818;
            border-radius: 0 0 12px 12px;
            margin-top: -8px;
            border: 1px solid transparent;
        }

        /* Khi mở menu thì hiện danh sách (tăng max-height) */
        .dropdown-content.show {
            max-height: 1000px; /* Đủ lớn để chứa danh sách tài liệu */
            border-color: #333333;
            padding: 10px 0;
            margin-bottom: 10px;
        }

        /* Các mục tài liệu bên trong */
        .doc-item {
            display: block;
            padding: 10px 20px;
            color: #b0b0b0;
            text-decoration: none;
            font-size: 0.92rem;
            text-align: left;
            transition: all 0.2s ease;
            border-left: 2px solid transparent;
        }

        .doc-item:hover {
            background-color: #222222;
            color: #ffffff;
            border-left-color: #888888;
            padding-left: 25px;
        }

        /* Chân trang */
        footer {
            font-size: 0.85rem;
            color: #666666;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="profile-title">Kho Tài Liệu Học Tập</h1>
        <p class="profile-desc">Nơi lưu trữ và tổng hợp các tài liệu môn học kỹ thuật chuyên ngành.</p>

        <div class="button-group">
            <!-- Mục PHYSICS có menu thả xuống -->
            <div class="dropdown-container">
                <button class="btn dropdown-btn" onclick="toggleDropdown()">
                    <span>PHYSICS</span>
                    <span class="arrow">▼</span>
                </button>
                <div class="dropdown-content" id="physicsSubMenu">
                    <a href="#" class="doc-item">📁 physics1</a>
                    <a href="#" class="doc-item">📄 chuong1li1.pdf</a>
                    <a href="#" class="doc-item">📄 chuong2li2.pdf</a>
                    <a href="#" class="doc-item">📄 chuong3li3.pdf</a>
                    <a href="#" class="doc-item">📄 chuong4li4.pdf</a>
                    <a href="#" class="doc-item">📄 halliday & resrick (Parts)</a>
                </div>
            </div>

            <!-- Các nút môn khác -->
            <a href="#" class="btn">CALCULUS</a>
            <a href="#" class="btn">LINEAR</a>
        </div>
    </div>

    <footer>
        &copy; 2026 Designed for Study.
    </footer>

    <script>
        // Hàm xử lý bật/tắt menu trượt
        function toggleDropdown() {
            const btn = document.querySelector('.dropdown-btn');
            const content = document.getElementById('physicsSubMenu');
            
            btn.classList.toggle('active');
            content.classList.toggle('show');
        }
    </script>

</body>
</html>
